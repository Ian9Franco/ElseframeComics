name: Publish Elseframe Editor

on:
  workflow_dispatch:
    inputs:
      message:
        description: Commit message
        required: false
        default: "publish from web editor"

permissions:
  contents: write

concurrency:
  group: elseframe-editor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require ELSEFRAME_PUBLISH_TOKEN for assets repo
        env:
          PUBLISH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Falta el secret ELSEFRAME_PUBLISH_TOKEN en este repo (Settings → Secrets and variables → Actions). Usá el mismo PAT que GITHUB_EDITOR_TOKEN en Vercel."
            exit 1
          fi

      # Mismo repo que el workflow: usa GITHUB_TOKEN (no hace falta el PAT en este paso).
      - name: Checkout main app workspace
        uses: actions/checkout@v4
        with:
          ref: editor-workspace
          path: the-boys
          fetch-depth: 0

      - name: Checkout assets workspace
        uses: actions/checkout@v4
        with:
          repository: Ian9Franco/theboyz-comic-v1
          ref: editor-workspace
          path: theboyz-comic-v1
          token: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: the-boys
        run: npm ci

      - name: Install asset dependencies
        working-directory: theboyz-comic-v1
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "Elseframe Editor"
          git config --global user.email "actions@github.com"

      - name: Publish
        working-directory: the-boys
        env:
          PUBLISH_TARGET_BRANCH: main
        run: npm run publish:all "${{ inputs.message }}"
