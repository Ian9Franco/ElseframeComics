# Publicación de contenido del editor (JSON / sync de assets), no suite de tests de app.
name: Publish Elseframe Editor

on:
  workflow_dispatch:
    inputs:
      message:
        description: Commit message
        required: false
        default: "publish from web editor"

permissions:
  contents: write

concurrency:
  group: elseframe-editor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check ELSEFRAME_PUBLISH_TOKEN
        id: pat
        env:
          PUBLISH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secret ELSEFRAME_PUBLISH_TOKEN (ElseframeComics → Settings → Secrets and variables → Actions). Sin él no se puede publicar el repo de assets."
            exit 0
          fi
          # El nombre nuevo se prueba primero. Si el repo todavía no se renombró,
          # se usa Elseframe-comic-v1. curl -L porque GitHub responde 301 al slug viejo.
          repo_name=""
          auth_code=""
          for candidate in ElseframeComics-assets-v1 Elseframe-comic-v1; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Ian9Franco/${candidate}")
            if [ "$code" = "200" ]; then
              repo_name="$candidate"
              break
            fi
            auth_code="$code"
            if [ "$code" = "401" ]; then
              break
            fi
          done
          if [ -n "$repo_name" ]; then
            echo "mode=auth" >> "$GITHUB_OUTPUT"
            echo "repo=$repo_name" >> "$GITHUB_OUTPUT"
            echo "PAT OK para $repo_name"
          elif [ "$auth_code" = "401" ]; then
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "::warning::HTTP 401 con ELSEFRAME_PUBLISH_TOKEN: GitHub no acepta el valor guardado en el secret de Actions (aunque el PAT esté activo). Pegá en el secret exactamente el mismo github_pat_... que GITHUB_EDITOR_TOKEN de Vercel."
          else
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "::warning::ELSEFRAME_PUBLISH_TOKEN no accede a ElseframeComics-assets-v1 (HTTP ${auth_code}). Incluí ese repo en el fine-grained token."
          fi

      - name: Checkout main app workspace
        uses: actions/checkout@v4
        with:
          ref: editor-workspace
          path: elseframe
          # Default depth=1: evita bajar ~1.5GB de historial (public/comics en commits viejos).
          fetch-depth: 1
          show-progress: false

      - name: Record workspace commit
        id: ws
        run: echo "sha=$(git -C elseframe rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout assets workspace
        env:
          GH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
          PAT_MODE: ${{ steps.pat.outputs.mode }}
          REPO_NAME: ${{ steps.pat.outputs.repo }}
        run: |
          set -euo pipefail
          NAME="${REPO_NAME:-}"
          if [ "$PAT_MODE" = "auth" ]; then
            NAME="${NAME:-ElseframeComics-assets-v1}"
            REPO="https://x-access-token:${GH_TOKEN}@github.com/Ian9Franco/${NAME}.git"
          else
            if [ -z "$NAME" ]; then
              for candidate in ElseframeComics-assets-v1 Elseframe-comic-v1; do
                if git ls-remote --exit-code "https://github.com/Ian9Franco/${candidate}.git" HEAD >/dev/null 2>&1; then
                  NAME="$candidate"
                  break
                fi
              done
            fi
            NAME="${NAME:-ElseframeComics-assets-v1}"
            REPO="https://github.com/Ian9Franco/${NAME}.git"
          fi
          echo "Clonando assets desde Ian9Franco/${NAME}"
          BRANCH=main
          if git ls-remote --exit-code "$REPO" refs/heads/editor-workspace >/dev/null 2>&1; then
            BRANCH=editor-workspace
          fi
          # Shallow + blobless remote: historial mínimo; blobs de HEAD bajo demanda si hace falta.
          git clone --filter=blob:none --single-branch --depth 1 --branch "$BRANCH" "$REPO" elseframe-comic-v1
          git -C elseframe-comic-v1 fetch --depth=64 origin main

          if [ "$BRANCH" = "editor-workspace" ] && \
             ! git -C elseframe-comic-v1 merge-base --is-ancestor origin/editor-workspace origin/main; then
            if [ "$PAT_MODE" != "auth" ]; then
              echo "::error::Hay cambios de páginas (subidas, borrados o renumeración) en elseframe-comic-v1/editor-workspace, pero ELSEFRAME_PUBLISH_TOKEN no es válido, así que no se pueden publicar. Corregí el secret y volvé a publicar."
              exit 1
            fi
            echo "Hay cambios de páginas pendientes en assets/editor-workspace."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config --global user.name "Elseframe Editor"
          git config --global user.email "actions@github.com"

      # editor-workspace puede tener versiones viejas de los scripts. Se usan los de main,
      # copiados fuera del checkout para que el working tree quede limpio para el merge.
      - name: Deepen refs for merge (shallow CI)
        run: |
          set -euo pipefail
          git -C elseframe fetch --depth=64 origin main editor-workspace
          git -C elseframe-comic-v1 fetch --depth=64 origin main || true

      - name: Load publish scripts from main
        working-directory: elseframe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish-tools"
          git show origin/main:scripts/deploy/publish-all.js > "$RUNNER_TEMP/publish-tools/publish-all.js"
          git show origin/main:scripts/deploy/sync-placeholders.js > "$RUNNER_TEMP/publish-tools/sync-placeholders.js"

      - name: Publish
        id: publish
        working-directory: elseframe
        env:
          PUBLISH_TARGET_BRANCH: main
          PUBLISH_SKIP_OPTIMIZE: "1"
          SYNC_JSON_SOURCE: web
          PUBLISH_PROJECT_ROOT: ${{ github.workspace }}/elseframe
          PUBLISH_ASSETS_ROOT: ${{ github.workspace }}/elseframe-comic-v1
          PAT_MODE: ${{ steps.pat.outputs.mode }}
          COMMIT_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          if [ "$PAT_MODE" != "auth" ]; then
            echo "Sin PAT válido: no se intentará push al repo de fotos."
            export PUBLISH_SKIP_ASSETS_PUSH=1
          fi
          node "$RUNNER_TEMP/publish-tools/publish-all.js" "$COMMIT_MESSAGE" | tee /tmp/publish-all.log
          if ! grep -q "PUBLISH_MAIN_PUSHED=1" /tmp/publish-all.log; then
            WS_SHA=$(git rev-parse HEAD)
            git fetch origin main
            if ! git merge-base --is-ancestor "$WS_SHA" origin/main; then
              echo "::error::No se pudo llevar editor-workspace a main (workspace $WS_SHA no está en origin/main). Revisá el paso Publish."
              exit 1
            fi
            echo "main ya contenía el workspace; no hubo commits nuevos que publicar."
          fi

      - name: Verify main contains published workspace
        working-directory: elseframe
        env:
          WS_SHA: ${{ steps.ws.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=64 origin main
          if ! git merge-base --is-ancestor "$WS_SHA" origin/main; then
            echo "::error::Tras publicar, origin/main aún no incluye editor-workspace @ $WS_SHA."
            exit 1
          fi
          echo "OK: origin/main incluye editor-workspace @ $WS_SHA"
