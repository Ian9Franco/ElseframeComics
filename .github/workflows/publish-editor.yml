name: Publish Elseframe Editor

on:
  workflow_dispatch:
    inputs:
      message:
        description: Commit message
        required: false
        default: "publish from web editor"

permissions:
  contents: write

concurrency:
  group: elseframe-editor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check ELSEFRAME_PUBLISH_TOKEN
        id: pat
        env:
          PUBLISH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta ELSEFRAME_PUBLISH_TOKEN en ElseframeComics → Settings → Secrets → Actions. Solo se publicará el repo de la app si hay cambios; push a assets requiere PAT."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Ian9Franco/theboyz-comic-v1")
          if [ "$code" = "200" ]; then
            echo "mode=auth" >> "$GITHUB_OUTPUT"
            echo "PAT OK para theboyz-comic-v1"
          elif [ "$code" = "401" ]; then
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "::warning::HTTP 401: el valor de ELSEFRAME_PUBLISH_TOKEN no es un PAT válido (revocado, mal pegado o expirado). Regenerá el token, actualizá el secret en ElseframeComics Actions y Vercel GITHUB_EDITOR_TOKEN con el mismo github_pat_.... Mientras tanto: clone público de assets."
          else
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "::warning::PAT no accede a theboyz-comic-v1 (HTTP ${code}). Incluí ambos repos en el fine-grained token. Clone público de assets."
          fi

      - name: Checkout main app workspace
        uses: actions/checkout@v4
        with:
          ref: editor-workspace
          path: the-boys
          fetch-depth: 0

      - name: Checkout assets workspace
        env:
          GH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          REPO="https://github.com/Ian9Franco/theboyz-comic-v1.git"
          BRANCH=main
          if [ "${{ steps.pat.outputs.mode }}" = "auth" ]; then
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Ian9Franco/theboyz-comic-v1/branches/editor-workspace" >/dev/null 2>&1; then
              BRANCH=editor-workspace
            fi
            git clone --depth 1 --branch "$BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/Ian9Franco/theboyz-comic-v1.git" \
              theboyz-comic-v1
            git -C theboyz-comic-v1 remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/Ian9Franco/theboyz-comic-v1.git"
          else
            if git ls-remote --exit-code "$REPO" refs/heads/editor-workspace >/dev/null 2>&1; then
              BRANCH=editor-workspace
            fi
            git clone --depth 1 --branch "$BRANCH" "$REPO" theboyz-comic-v1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-boys/package-lock.json

      - name: Install app dependencies
        working-directory: the-boys
        run: npm ci

      - name: Install asset dependencies
        working-directory: theboyz-comic-v1
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "Elseframe Editor"
          git config --global user.email "actions@github.com"

      - name: Fetch git refs for publish merge
        working-directory: the-boys
        run: |
          set -euo pipefail
          git fetch origin main editor-workspace --prune

      - name: Publish
        id: publish
        working-directory: the-boys
        env:
          PUBLISH_TARGET_BRANCH: main
          PUBLISH_SKIP_OPTIMIZE: "1"
          GH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
          ASSETS_PAT_AUTH: ${{ steps.pat.outputs.mode }}
        run: |
          set -euo pipefail
          git fetch origin main editor-workspace --prune
          if [ "$ASSETS_PAT_AUTH" = "auth" ]; then
            git -C ../theboyz-comic-v1 remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/Ian9Franco/theboyz-comic-v1.git"
            git -C ../theboyz-comic-v1 fetch origin main --depth=50 || true
          else
            echo "Sin PAT válido: no se intentará push a theboyz-comic-v1 si hubiera cambios en assets."
            export PUBLISH_SKIP_ASSETS_PUSH=1
          fi
          npm run publish:all "${{ inputs.message }}" | tee /tmp/publish-all.log
          if ! grep -q "PUBLISH_MAIN_PUSHED=1" /tmp/publish-all.log; then
            WS_SHA=$(git rev-parse HEAD)
            git fetch origin main
            if ! git merge-base --is-ancestor "$WS_SHA" origin/main; then
              echo "::error::Publicación no llevó editor-workspace a main (workspace $WS_SHA no está en origin/main)."
              echo "Los guardados del editor ya están commiteados en editor-workspace; hace falta push a main."
              exit 1
            fi
            echo "main ya contenía el workspace; no hubo commits nuevos que publicar."
          fi

      - name: Verify main contains workspace tip
        working-directory: the-boys
        run: |
          set -euo pipefail
          git fetch origin main editor-workspace
          WS_SHA=$(git rev-parse origin/editor-workspace)
          if ! git merge-base --is-ancestor "$WS_SHA" origin/main; then
            echo "::error::Tras publicar, origin/main aún no incluye el tip de editor-workspace ($WS_SHA)."
            exit 1
          fi
          echo "OK: origin/main incluye editor-workspace @ $WS_SHA"
