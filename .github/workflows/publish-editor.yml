name: Publish Elseframe Editor

on:
  workflow_dispatch:
    inputs:
      message:
        description: Commit message
        required: false
        default: "publish from web editor"

permissions:
  contents: write

concurrency:
  group: elseframe-editor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate ELSEFRAME_PUBLISH_TOKEN (repo ElseframeComics)
        env:
          PUBLISH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Falta ELSEFRAME_PUBLISH_TOKEN en ElseframeComics → Settings → Secrets → Actions (no en theboyz-comic-v1)."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Ian9Franco/theboyz-comic-v1")
          if [ "$code" != "200" ]; then
            echo "::error::El PAT no accede a theboyz-comic-v1 (HTTP ${code}). En el fine-grained token incluí ambos repos con Contents read/write."
            exit 1
          fi

      # Mismo repo que el workflow: usa GITHUB_TOKEN del runner.
      - name: Checkout main app workspace
        uses: actions/checkout@v4
        with:
          ref: editor-workspace
          path: the-boys
          fetch-depth: 1

      # actions/checkout a veces no autentica el 2º repo; clone explícito con PAT.
      - name: Checkout assets workspace
        env:
          GH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Ian9Franco/theboyz-comic-v1"
          if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}/branches/editor-workspace" >/dev/null 2>&1; then
            BRANCH=editor-workspace
          else
            echo "Rama editor-workspace no existe en assets; clonando main."
            BRANCH=main
          fi
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/Ian9Franco/theboyz-comic-v1.git" \
            theboyz-comic-v1
          git -C theboyz-comic-v1 remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/Ian9Franco/theboyz-comic-v1.git"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: the-boys/package-lock.json

      - name: Install app dependencies
        working-directory: the-boys
        run: npm ci

      - name: Install asset dependencies
        working-directory: theboyz-comic-v1
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "Elseframe Editor"
          git config --global user.email "actions@github.com"

      - name: Publish
        working-directory: the-boys
        env:
          PUBLISH_TARGET_BRANCH: main
          # En CI omitimos convert/compress (lento); optimizá assets en local si hace falta.
          PUBLISH_SKIP_OPTIMIZE: "1"
          GH_TOKEN: ${{ secrets.ELSEFRAME_PUBLISH_TOKEN }}
        run: |
          git -C ../theboyz-comic-v1 remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/Ian9Franco/theboyz-comic-v1.git"
          npm run publish:all "${{ inputs.message }}"
